<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PixelEstudio — Editor de imágenes</title>
<style>
:root{
  --bg0:#1c1e22; --bg1:#25282d; --bg2:#2f3339; --bg3:#3a3f47; --bgc:#151719;
  --line:#383c43; --line2:#4a4f58; --text:#e7e9ec; --text2:#a4abb5; --text3:#7b828c;
  --accent:#3b82f6; --accent2:#60a5fa; --accentbg:rgba(59,130,246,.18); --danger:#ef4444; --ok:#22c55e;
  --shadow:0 10px 40px rgba(0,0,0,.45); --radius:8px;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg0:#e9ebef; --bg1:#f7f8fa; --bg2:#e6e8ec; --bg3:#d6d9df; --bgc:#cfd3d9;
  --line:#d3d6dc; --line2:#bfc4cc; --text:#1d2127; --text2:#535b66; --text3:#848b96;
  --accentbg:rgba(59,130,246,.14); --shadow:0 10px 40px rgba(0,0,0,.18);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg0);color:var(--text);font:13px/1.35 var(--font);user-select:none;-webkit-user-select:none}
button,input,select,textarea{font:inherit;color:inherit}
input[type=text],input[type=number],select,textarea{background:var(--bg2);border:1px solid var(--line);border-radius:5px;padding:3px 6px;outline:none;min-width:0}
input[type=text]:focus,input[type=number]:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{user-select:text;-webkit-user-select:text}
input[type=number]{width:58px}
input[type=range]{accent-color:var(--accent);height:16px;cursor:pointer}
input[type=checkbox]{accent-color:var(--accent);cursor:pointer}
input[type=color]{width:28px;height:24px;border:1px solid var(--line2);border-radius:5px;padding:0;background:none;cursor:pointer}
input[type=color]::-webkit-color-swatch-wrapper{padding:2px}
input[type=color]::-webkit-color-swatch{border:none;border-radius:3px}
.btn{background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:5px 11px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--bg3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent2)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:3px 8px;font-size:12px}
.ibtn{background:none;border:none;border-radius:5px;width:28px;height:28px;display:inline-grid;place-items:center;cursor:pointer;color:var(--text2);padding:0;flex:none}
.ibtn:hover{background:var(--bg3);color:var(--text)}
.ibtn.on{background:var(--accentbg);color:var(--accent2)}
.ibtn:disabled{opacity:.35;cursor:default;background:none}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:10px;border:2px solid var(--bg1)}
::-webkit-scrollbar-track{background:transparent}

#app{display:grid;grid-template-rows:36px 42px 1fr 26px;height:100vh}
/* Menú */
#menubar{display:flex;align-items:center;background:var(--bg1);border-bottom:1px solid var(--line);padding:0 6px;gap:2px;position:relative;z-index:50}
#logo{display:flex;align-items:center;gap:7px;font-weight:700;padding:0 10px 0 4px;letter-spacing:.2px}
#logo b{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,#6366f1,#3b82f6 50%,#06b6d4);display:grid;place-items:center;color:#fff;font-size:12px}
.menu{position:relative}
.menu>button{background:none;border:none;padding:5px 9px;border-radius:5px;cursor:pointer;color:var(--text)}
.menu>button:hover,.menu.open>button{background:var(--bg3)}
.dropdown{position:absolute;top:100%;left:0;min-width:250px;background:var(--bg1);border:1px solid var(--line2);border-radius:var(--radius);box-shadow:var(--shadow);padding:5px;display:none;z-index:60}
.menu.open>.dropdown{display:block}
.mi{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:5px;cursor:pointer;white-space:nowrap;position:relative}
.mi:hover{background:var(--accent);color:#fff}
.mi:hover .acc{color:#e0eaff}
.mi .acc{margin-left:auto;color:var(--text3);font-size:11.5px;padding-left:18px}
.mi.dis{opacity:.4;pointer-events:none}
.msep{height:1px;background:var(--line);margin:4px 6px}
.mi.sub::after{content:"›";margin-left:auto;padding-left:16px}
.mi.sub>.dropdown{left:100%;top:-6px}
.mi.sub:hover>.dropdown{display:block}
.mi .mic{width:16px;text-align:center;opacity:.8}
#menuRight{margin-left:auto;display:flex;gap:4px;align-items:center}
#docTitleTop{color:var(--text3);font-size:12px;margin-right:8px;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Barra de opciones */
#optionsbar{display:flex;align-items:center;gap:12px;padding:0 12px;background:var(--bg1);border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden;white-space:nowrap}
#optionsbar::-webkit-scrollbar{height:4px}
.ob-tool{display:flex;align-items:center;gap:7px;font-weight:600;padding-right:12px;border-right:1px solid var(--line);height:26px}
.ob-item{display:flex;align-items:center;gap:6px;flex:none}
.ob-item label{color:var(--text2);font-size:12px}
.ob-item input[type=range]{width:96px}
.ob-item input[type=number]{width:52px;padding:2px 4px}
.ob-sep{width:1px;height:22px;background:var(--line);flex:none}
.seg{display:inline-flex;background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:1px}
.seg button{background:none;border:none;border-radius:4px;padding:3px 8px;cursor:pointer;color:var(--text2);display:inline-flex;align-items:center;gap:5px;min-height:22px}
.seg button.on{background:var(--accent);color:#fff}
.seg button:hover:not(.on){background:var(--bg3);color:var(--text)}
.seg svg.i{width:15px;height:15px}

#main{display:grid;grid-template-columns:54px 1fr 304px;min-height:0}
/* Herramientas */
#toolbar{background:var(--bg1);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:6px 0;gap:2px;overflow-y:auto;overflow-x:hidden}
#toolbar::-webkit-scrollbar{width:0}
.tool{width:38px;height:32px;border-radius:7px;border:none;background:none;color:var(--text2);display:grid;place-items:center;cursor:pointer;flex:none;position:relative}
.tool:hover{background:var(--bg3);color:var(--text)}
.tool.on{background:var(--accent);color:#fff}
.tool svg.i{width:20px;height:20px}
.tsep{width:28px;height:1px;background:var(--line);margin:2px 0;flex:none}
@media (max-height:800px){#main{grid-template-columns:80px 1fr 304px}#toolbar{display:grid;grid-template-columns:36px 36px;align-content:start;justify-content:center;gap:2px}.tool{width:36px;height:32px}.tsep{grid-column:1/-1;width:100%}#colors{grid-column:1/-1;margin:8px auto 0}}
#colors{position:relative;width:44px;height:48px;margin-top:8px;flex:none}
#colors .sw{position:absolute;width:26px;height:26px;border-radius:5px;border:2px solid var(--bg1);box-shadow:0 0 0 1px var(--line2);cursor:pointer}
#swFg{left:3px;top:3px;z-index:2}
#swBg{left:16px;top:17px}
#swSwap,#swReset{position:absolute;background:none;border:none;color:var(--text2);cursor:pointer;padding:0;width:14px;height:14px;display:grid;place-items:center}
#swSwap{right:-2px;top:0}
#swReset{left:0;bottom:-4px}
#swSwap svg,#swReset svg{width:12px;height:12px}

/* Centro */
#center{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bgc)}
#tabs{display:flex;background:var(--bg0);border-bottom:1px solid var(--line);min-height:32px;overflow-x:auto}
#tabs:empty{display:none}
.tab{display:flex;align-items:center;gap:8px;padding:0 6px 0 12px;border-right:1px solid var(--line);cursor:pointer;color:var(--text2);font-size:12.5px;max-width:240px;flex:none}
.tab span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab.on{background:var(--bgc);color:var(--text);box-shadow:inset 0 2px 0 var(--accent)}
.tab .ibtn{width:20px;height:20px}
.tab .ibtn svg{width:13px;height:13px}
#viewport{position:relative;flex:1;min-height:0;overflow:hidden;outline:none}
#view{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#busy{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:var(--bg1);border:1px solid var(--line2);padding:6px 14px;border-radius:20px;display:none;box-shadow:var(--shadow);z-index:5}
#busy.on{display:block}

/* Bienvenida */
#welcome{position:absolute;inset:0;overflow:auto;display:none;padding:40px 30px;background:var(--bgc)}
#welcome.on{display:block}
.wl-in{max-width:980px;margin:0 auto}
.wl-hero{display:flex;align-items:center;gap:18px;margin-bottom:6px}
.wl-hero .big{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,#6366f1,#3b82f6 50%,#06b6d4);display:grid;place-items:center;color:#fff;font-size:26px;font-weight:800;box-shadow:0 8px 30px rgba(59,130,246,.35)}
.wl-hero h1{margin:0;font-size:28px}
.wl-hero p{margin:3px 0 0;color:var(--text2)}
.wl-actions{display:flex;gap:10px;margin:26px 0 30px;flex-wrap:wrap}
.wl-actions .btn{padding:10px 16px;font-size:14px}
.wl-actions .btn svg{width:18px;height:18px}
.wl-sec{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);margin:0 0 10px}
.wl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:30px}
.preset{background:var(--bg1);border:1px solid var(--line);border-radius:10px;padding:14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;transition:.15s}
.preset:hover{border-color:var(--accent);transform:translateY(-2px)}
.preset .shape{background:var(--bg3);border-radius:4px;border:1px solid var(--line2)}
.preset b{font-weight:600}
.preset small{color:var(--text3)}
.drop{border:2px dashed var(--line2);border-radius:12px;padding:28px;text-align:center;color:var(--text2)}
.drop b{color:var(--text)}
#dropOverlay{position:fixed;inset:0;background:rgba(59,130,246,.15);border:3px dashed var(--accent);z-index:300;display:none;place-items:center;font-size:22px;font-weight:600;pointer-events:none}
#dropOverlay.on{display:grid}
.tips{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.tipc{background:var(--bg1);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;gap:12px}
.tipc .em{font-size:22px}
.tipc p{margin:3px 0 0;color:var(--text2)}

/* Paneles */
#panels{background:var(--bg1);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.pg{display:flex;flex-direction:column;border-bottom:1px solid var(--line);min-height:0}
.pg.grow{flex:1}
.ptabs{display:flex;align-items:center;background:var(--bg0);border-bottom:1px solid var(--line);padding:0 4px;flex:none}
.ptab{background:none;border:none;padding:8px 10px;cursor:pointer;color:var(--text3);font-weight:600;font-size:12px;border-bottom:2px solid transparent}
.ptab.on{color:var(--text);border-bottom-color:var(--accent)}
.ptabs .grow{flex:1}
.pbody{overflow:auto;padding:10px;display:none;min-height:0}
.pbody.on{display:block}
.pg.grow .pbody.on{display:flex;flex-direction:column;flex:1;padding:0}
.pg.collapsed .pbody{display:none!important}
#pgTop .pbody{max-height:48vh}

/* Panel color */
.cp-top{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.cp-sw{display:flex;gap:5px}
.cp-sw div{width:30px;height:30px;border-radius:6px;border:2px solid transparent;box-shadow:0 0 0 1px var(--line2);cursor:pointer}
.cp-sw div.on{border-color:var(--accent)}
#svBox{position:relative;width:100%;height:120px;border-radius:6px;overflow:hidden;cursor:crosshair;touch-action:none}
#svBox canvas,#hueBar canvas{width:100%;height:100%;display:block}
#svDot{position:absolute;width:12px;height:12px;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.5);transform:translate(-50%,-50%);pointer-events:none}
#hueBar{position:relative;height:12px;margin:8px 0;border-radius:6px;overflow:hidden;cursor:pointer;touch-action:none}
#hueDot{position:absolute;top:0;width:6px;height:12px;border:2px solid #fff;border-radius:3px;box-shadow:0 0 0 1px rgba(0,0,0,.5);transform:translateX(-50%);pointer-events:none}
.cp-in{display:flex;gap:6px;align-items:center}
.cp-in input{width:100%;text-align:center}
.cp-in label{color:var(--text3);font-size:11px}
.swatches{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;margin-top:8px}
.swatches div{aspect-ratio:1;border-radius:3px;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(127,127,127,.3)}
.swatches div:hover{transform:scale(1.2);z-index:1}
.ptitle{font-size:11px;text-transform:uppercase;color:var(--text3);letter-spacing:.06em;margin:10px 0 5px;display:flex;align-items:center;justify-content:space-between}

/* Panel rápido */
.qrow{display:grid;grid-template-columns:86px 1fr 34px;align-items:center;gap:6px;margin:4px 0}
.qrow label{color:var(--text2);font-size:12px}
.qrow input[type=range]{width:100%}
.qrow span{text-align:right;color:var(--text3);font-size:11.5px;font-variant-numeric:tabular-nums}
.qbtns{display:flex;gap:6px;margin-top:8px}
.qbtns .btn{flex:1;justify-content:center}
.styles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stl{cursor:pointer;text-align:center;font-size:11px;color:var(--text2)}
.stl canvas{width:100%;aspect-ratio:1;border-radius:6px;display:block;background:var(--bg3);border:2px solid transparent}
.stl:hover canvas{border-color:var(--accent)}
.bigact{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.bigact .btn{justify-content:flex-start;padding:8px 9px;font-size:12px}

/* Capas */
.lp-head{padding:8px;display:grid;grid-template-columns:1fr 1fr;gap:6px;border-bottom:1px solid var(--line);flex:none}
.lp-head .row{display:flex;align-items:center;gap:6px}
.lp-head label{color:var(--text3);font-size:11px;flex:none}
.lp-head select{width:100%}
.lp-head input[type=range]{width:100%;min-width:0}
#layerList{flex:1;overflow:auto;min-height:60px}
.layer{display:flex;align-items:center;gap:6px;padding:4px 6px 4px 2px;border-bottom:1px solid var(--line);cursor:pointer;min-height:46px;position:relative}
.layer:hover{background:var(--bg2)}
.layer.on{background:var(--accentbg)}
.layer.dragover-top{box-shadow:inset 0 2px 0 var(--accent)}
.layer.dragover-bot{box-shadow:inset 0 -2px 0 var(--accent)}
.layer .ibtn{width:24px;height:24px}
.layer .ibtn svg{width:15px;height:15px}
.lthumb{width:38px;height:38px;border-radius:4px;flex:none;background-image:conic-gradient(#bbb 25%,#fff 0 50%,#bbb 0 75%,#fff 0);background-size:8px 8px;border:2px solid transparent;display:grid;place-items:center;overflow:hidden}
.lthumb canvas{max-width:100%;max-height:100%;display:block}
.lthumb.sel{border-color:var(--accent)}
.lthumb.txt{background:var(--bg3);font-weight:800;font-size:18px;color:var(--text);font-family:Georgia,serif}
.lname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lname input{width:100%}
.lbadges{display:flex;gap:2px;color:var(--text3);align-items:center}
.lbadges .fx{font-size:10px;font-weight:700;font-style:italic;border:1px solid var(--line2);border-radius:3px;padding:0 3px;cursor:pointer}
.layer.hidden .lthumb,.layer.hidden .lname{opacity:.4}
.lp-foot{display:flex;justify-content:space-around;padding:4px;border-top:1px solid var(--line);flex:none;background:var(--bg1)}
#histList{flex:1;overflow:auto}
.hi{padding:6px 10px;display:flex;gap:8px;align-items:center;cursor:pointer;border-bottom:1px solid var(--line)}
.hi:hover{background:var(--bg2)}
.hi.on{background:var(--accentbg);color:var(--text)}
.hi.fut{opacity:.4}
.hi .n{color:var(--text3);font-size:11px;width:20px;text-align:right;flex:none}
.empty{padding:20px;color:var(--text3);text-align:center}

/* Estado */
#statusbar{display:flex;align-items:center;gap:14px;padding:0 10px;background:var(--bg1);border-top:1px solid var(--line);font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden}
#statusbar .zoomctl{display:flex;align-items:center;gap:2px}
#statusbar .zoomctl input{width:56px;padding:1px 4px;text-align:right}
#statusbar .zoomctl .ibtn{width:22px;height:22px}
#statusbar .zoomctl .ibtn svg{width:14px;height:14px}
#stHint{margin-left:auto;color:var(--text3);overflow:hidden;text-overflow:ellipsis}
#stHint b{color:var(--accent2);font-weight:600}

/* Modales */
.mback{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45)}
.mback.float{background:transparent;pointer-events:none;align-items:flex-start;justify-content:flex-end;padding:86px 10px 0 0}
.modal{background:var(--bg1);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow);width:min(440px,94vw);max-height:88vh;display:flex;flex-direction:column;pointer-events:auto}
.modal.wide{width:min(720px,96vw)}
.mhead{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:600;font-size:14px;cursor:move}
.mhead .ibtn{margin-left:auto}
.mbody{padding:14px;overflow:auto}
.mfoot{display:flex;gap:8px;justify-content:flex-end;padding:12px 14px;border-top:1px solid var(--line);align-items:center}
.mfoot .left{margin-right:auto;display:flex;align-items:center;gap:6px;color:var(--text2)}
.frow{display:grid;grid-template-columns:120px 1fr 56px;align-items:center;gap:8px;margin:8px 0}
.frow>label{color:var(--text2)}
.frow input[type=range]{width:100%}
.frow.two{grid-template-columns:120px 1fr}
.fnote{color:var(--text3);font-size:12px;margin:2px 0 8px;line-height:1.45}
.fhelp{background:var(--accentbg);border-radius:8px;padding:8px 10px;color:var(--text2);font-size:12px;margin-bottom:10px;line-height:1.45}
.anchor{display:grid;grid-template-columns:repeat(3,26px);gap:3px}
.anchor button{width:26px;height:26px;border:1px solid var(--line2);background:var(--bg2);border-radius:4px;cursor:pointer}
.anchor button.on{background:var(--accent)}
.kbd{display:grid;grid-template-columns:1fr auto;gap:5px 18px}
.kbd kbd{background:var(--bg2);border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:1px 6px;font:11.5px ui-monospace,monospace;justify-self:end}
.kcols{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.kcols h4{margin:8px 0 6px;color:var(--accent2)}
#curveCv{width:100%;aspect-ratio:1;background:var(--bg0);border-radius:6px;display:block;cursor:crosshair;touch-action:none}

/* Tooltip y avisos */
#tip{position:fixed;z-index:400;background:#0f1114;color:#eef1f5;border:1px solid #3a3f47;padding:7px 10px;border-radius:7px;max-width:270px;font-size:12px;pointer-events:none;opacity:0;transition:opacity .12s;box-shadow:0 6px 20px rgba(0,0,0,.4)}
#tip.on{opacity:1}
#tip b{display:block;margin-bottom:2px}
#tip kbd{background:#2a2e35;border-radius:3px;padding:0 5px;font:11px ui-monospace,monospace;margin-left:6px}
#tip p{margin:0;color:#b9c0ca}
#toasts{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);z-index:500;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:#0f1114;color:#fff;padding:9px 16px;border-radius:20px;box-shadow:var(--shadow);font-size:13px;animation:tin .2s ease}
.toast.err{background:#7f1d1d}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
#ctx{position:fixed;z-index:300}
@media (max-width:900px){#main{grid-template-columns:50px 1fr 0}#panels{display:none}.mback.float{padding:80px 10px 0 0}}
</style>
</head>
<body>
<div id="app">
  <header id="menubar">
    <div id="logo"><b>P</b>PixelEstudio</div>
    <nav id="menus" style="display:flex"></nav>
    <div id="menuRight">
      <span id="docTitleTop"></span>
      <button class="ibtn" id="btnUndo" data-tip="Deshacer|Vuelve atrás el último cambio|Ctrl+Z"></button>
      <button class="ibtn" id="btnRedo" data-tip="Rehacer|Vuelve a aplicar lo deshecho|Ctrl+Shift+Z"></button>
      <button class="ibtn" id="btnTheme" data-tip="Tema claro / oscuro|Cambia los colores de la interfaz"></button>
      <button class="ibtn" id="btnHelp" data-tip="Ayuda|Guía rápida y atajos de teclado|F1"></button>
    </div>
  </header>
  <div id="optionsbar"></div>

function drawBrushCursor(g) {
  const t = tools[S.tool]; if (!doc || !t || !t.brush || !mouse.in || spaceDown) return;
  const r = O.size * doc.zoom / 2;
  if (r < 3) { g.strokeStyle = '#000'; g.lineWidth = 1; g.beginPath(); g.moveTo(mouse.sx - 6, mouse.sy); g.lineTo(mouse.sx + 6, mouse.sy); g.moveTo(mouse.sx, mouse.sy - 6); g.lineTo(mouse.sx, mouse.sy + 6); g.stroke(); return; }
  g.lineWidth = 1; g.strokeStyle = 'rgba(0,0,0,.8)'; g.beginPath(); g.arc(mouse.sx, mouse.sy, r, 0, Math.PI * 2); g.stroke();
  g.strokeStyle = 'rgba(255,255,255,.9)'; g.beginPath(); g.arc(mouse.sx, mouse.sy, r + 1, 0, Math.PI * 2); g.stroke();

/* =====================================================================

   ===================================================================== */
let drag = null, spaceDown = false;
function evtPoint(e) { const r = view.getBoundingClientRect(), sx = e.clientX - r.left, sy = e.clientY - r.top, [x, y] = s2d(sx, sy); return { x, y, sx, sy, shift: e.shiftKey, alt: e.altKey, ctrl: e.ctrlKey || e.metaKey, pressure: e.pointerType === 'pen' ? (e.pressure || .5) : 1, pen: e.pointerType === 'pen' }; }
view.addEventListener('pointerdown', e => {
  if (!doc) return; vp.focus({ preventScroll: true }); closeMenus();
  if (e.button === 2) return;
  const p = evtPoint(e); view.setPointerCapture(e.pointerId);
  if (e.button === 1 || spaceDown) { drag = { pan: true, sx: p.sx, sy: p.sy, px: doc.px, py: doc.py }; view.style.cursor = 'grabbing'; e.preventDefault(); return; }
  if (e.button !== 0) return;
  const t = tools[S.tool];
  if (p.alt && ['brush', 'pencil', 'bucket', 'gradient', 'shape', 'text'].includes(S.tool)) { const c = sampleColor(p.x, p.y, true); if (c) setColor('fg', c); drag = { eyedrop: true }; return; }
  if (quick.op) quickCommit();
  let r; try { r = t.down && t.down(p); } catch (err) { console.error(err); toast('Error: ' + err.message, true); r = false; }
  drag = r === false ? null : { tool: t };
});
view.addEventListener('pointermove', e => {
  if (!doc) return;
  const p = evtPoint(e); mouse.sx = p.sx; mouse.sy = p.sy; mouse.x = p.x; mouse.y = p.y; mouse.in = true;
  $('#stPos').textContent = (p.x >= 0 && p.y >= 0 && p.x < doc.w && p.y < doc.h) ? `X: ${Math.floor(p.x)}  Y: ${Math.floor(p.y)}` : '';
  if (drag && drag.pan) { doc.px = drag.px + p.sx - drag.sx; doc.py = drag.py + p.sy - drag.sy; requestRender(); return; }
  if (drag && drag.eyedrop) { const c = sampleColor(p.x, p.y, true); if (c) setColor('fg', c); return; }
  if (drag && drag.tool) {
    const t = drag.tool;
    if (t.brush && e.getCoalescedEvents) { for (const ce of e.getCoalescedEvents()) t.move && t.move(evtPoint(ce)); }
    else t.move && t.move(p);
    if (t.brush) requestRender();
    return;
  }
  const t = tools[S.tool]; if (t.hover) t.hover(p);
  if (t.brush || S.tool === 'dropper' || S.tool === 'clone') requestRender();
});
const endDrag = e => {
  if (!drag) return; const d = drag; drag = null;
  if (d.pan) { view.style.cursor = spaceDown ? 'grab' : (tools[S.tool].cursor || 'default'); return; }
  if (d.tool && d.tool.up) { try { d.tool.up(evtPoint(e)); } catch (err) { console.error(err); toast('Error: ' + err.message, true); } }
  requestRender();
};
view.addEventListener('pointerup', endDrag); view.addEventListener('pointercancel', endDrag);
view.addEventListener('pointerleave', () => { mouse.in = false; $('#stPos').textContent = ''; requestRender(); });
view.addEventListener('dblclick', () => { const t = tools[S.tool]; if (t.dbl) t.dbl(); });
view.addEventListener('contextmenu', e => e.preventDefault());
view.addEventListener('wheel', e => {
  if (!doc) return; e.preventDefault();
  const r = view.getBoundingClientRect(), sx = e.clientX - r.left, sy = e.clientY - r.top;
  if (e.ctrlKey || e.metaKey || e.altKey) { const f = Math.exp(-e.deltaY * (e.deltaMode ? 0.05 : 0.0025)); zoomAt(doc.zoom * f, sx, sy); }
  else { const k = e.deltaMode ? 30 : 1; if (e.shiftKey) doc.px -= (e.deltaY || e.deltaX) * k; else { doc.px -= e.deltaX * k; doc.py -= e.deltaY * k; } requestRender(); }
}, { passive: false });
addEventListener('resize', () => requestRender());

function comboOf(e) {
  let k = e.key; if (/^Key[A-Z]$/.test(e.code)) k = e.code.slice(3); else if (/^Digit\d$/.test(e.code)) k = e.code.slice(5); else if (k.length === 1) k = k.toUpperCase();
  if (e.code === 'Equal' && (e.ctrlKey || e.metaKey)) k = e.shiftKey ? '+' : '=';
  if (e.code === 'Minus') k = '-'; if (e.code === 'BracketLeft') k = '['; if (e.code === 'BracketRight') k = ']'; if (e.code === 'Quote' || e.code === 'Backslash') k = "'"; if (e.code === 'Slash') k = '/';
  if (k === 'Delete') k = 'Delete';
  return (e.ctrlKey || e.metaKey ? 'Ctrl+' : '') + (e.altKey ? 'Alt+' : '') + (e.shiftKey && k !== '+' ? 'Shift+' : '') + k;

document.addEventListener('keydown', e => {
  const tg = e.target, typing = tg.matches && tg.matches('input[type=text],input[type=number],textarea,select');
  if (typing) return;
  if (modalOpen()) { if ((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z')) e.preventDefault(); return; }
  if (e.key === 'Escape') closeMenus();
  if (e.code === 'Space') { if (document.activeElement && document.activeElement.tagName === 'BUTTON') document.activeElement.blur(); if (e.repeat) { e.preventDefault(); return; } if (doc) { spaceDown = true; view.style.cursor = 'grab'; e.preventDefault(); } return; }
  const t = tools[S.tool];
  if (doc && t.onKey && t.onKey(e) === true) { e.preventDefault(); return; }
  const combo = comboOf(e);
  if (ACC[combo]) { e.preventDefault(); try { ACC[combo](); } catch (err) { console.error(err); toast('Error: ' + err.message, true); } return; }
  if (combo === 'Ctrl+V') return; // lo gestiona el evento paste
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = combo.replace('Shift+', '');
  if (TOOL_KEYS[k] && !e.shiftKey) { const ids = TOOL_KEYS[k], i = ids.indexOf(S.tool); setTool(ids[(i + 1) % ids.length] || ids[0]); e.preventDefault(); return; }
  if (!doc) return;
  if (k === '[' || k === ']') { const st = O.size < 10 ? 1 : O.size < 50 ? 5 : O.size < 200 ? 10 : 25; O.size = clamp(O.size + (k === ']' ? st : -st), 1, 1000); syncOpt('size'); requestRender(); e.preventDefault(); return; }
  if (k === 'X') { swapColors(); return; } if (k === 'D') { resetColors(); return; }
  if (/^\d$/.test(k) && (t.opts || []).includes('opacity')) { O.opacity = k === '0' ? 100 : +k * 10; syncOpt('opacity'); toast('Opacidad ' + O.opacity + '%'); return; }

  if (e.key.startsWith('Arrow') && (S.tool === 'move' || S.tool === 'transform')) { const s = e.shiftKey ? 10 : 1; nudge(e.key === 'ArrowLeft' ? -s : e.key === 'ArrowRight' ? s : 0, e.key === 'ArrowUp' ? -s : e.key === 'ArrowDown' ? s : 0); e.preventDefault(); return; }
});
document.addEventListener('keyup', e => { if (e.code === 'Space') { spaceDown = false; if (!drag) view.style.cursor = tools[S.tool].cursor || 'default'; requestRender(); } });

  if (e.target.matches && e.target.matches('input,textarea')) return; if (modalOpen()) return;
  const items = [...(e.clipboardData ? e.clipboardData.items : [])], it = items.find(i => i.type.startsWith('image/'));

  if (S.clipboard) { pasteClip(); e.preventDefault(); }
});
let dragDepth = 0;
addEventListener('dragenter', e => { if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) { dragDepth++; $('#dropOverlay').classList.add('on'); } });
addEventListener('dragleave', () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) $('#dropOverlay').classList.remove('on'); });

function init() {

  $('#btnUndo').innerHTML = icon('undo'); $('#btnRedo').innerHTML = icon('redo'); $('#btnHelp').innerHTML = icon('help');
  $('#btnTheme').innerHTML = icon(document.documentElement.dataset.theme === 'light' ? 'moon' : 'sun');

  $('#zOut').innerHTML = icon('zoomOut'); $('#zIn').innerHTML = icon('zoom'); $('#zFit').innerHTML = icon('fit');
  $('#zOut').onclick = () => zoomStep(-1); $('#zIn').onclick = () => zoomStep(1); $('#zFit').onclick = () => fitView();
