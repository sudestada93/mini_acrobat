plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sudestada.btvolumen'
    compileSdk 34

    defaultConfig {
        applicationId 'com.sudestada.btvolumen'
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        // Misma llave que build_apk.sh, para poder actualizar la app instalada.
        volumenbt {
            storeFile rootProject.file('keystore/volumen-bt.jks')
            storePassword 'volumenbt'
            keyAlias 'volumenbt'
            keyPassword 'volumenbt'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.volumenbt
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.volumenbt
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
